<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Task Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1974&auto=format&fit=crop') no-repeat center center/cover;
min-height:100vh;
color:white;
overflow-x:hidden;
}

.overlay{
background:rgba(2,6,23,0.88);
min-height:100vh;
display:flex;
}

.sidebar{
width:240px;
background:rgba(15,23,42,0.95);
padding:25px;
display:flex;
flex-direction:column;
justify-content:space-between;
border-right:1px solid rgba(255,255,255,0.08);
}

.logo{
font-size:24px;
font-weight:bold;
color:#c084fc;
margin-bottom:40px;
}

.menu{
display:flex;
flex-direction:column;
gap:18px;
}

.menu a{
text-decoration:none;
color:white;
padding:14px;
border-radius:12px;
transition:0.3s;
background:rgba(255,255,255,0.04);
}

.menu a:hover{
background:linear-gradient(90deg,#9333ea,#2563eb);
}

.dark-toggle{
background:rgba(255,255,255,0.05);
padding:14px;
border-radius:12px;
text-align:center;
margin-top:30px;
}

.main{
flex:1;
padding:30px;
}

.heading{
font-size:42px;
font-weight:bold;
margin-bottom:25px;
background:linear-gradient(90deg,#c084fc,#38bdf8);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:rgba(15,23,42,0.75);
padding:22px;
border-radius:20px;
backdrop-filter:blur(10px);
box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.card h2{
font-size:18px;
margin-bottom:10px;
color:#cbd5e1;
}

.card p{
font-size:38px;
font-weight:bold;
}

.line{
height:5px;
border-radius:10px;
margin-top:15px;
}

.purple{
background:linear-gradient(90deg,#a855f7,#d946ef);
}

.green{
background:linear-gradient(90deg,#22c55e,#4ade80);
}

.orange{
background:linear-gradient(90deg,#fb923c,#facc15);
}

.blue{
background:linear-gradient(90deg,#38bdf8,#2563eb);
}

.form-box{
background:rgba(15,23,42,0.78);
padding:25px;
border-radius:22px;
margin-bottom:25px;
backdrop-filter:blur(10px);
}

.form-grid{
display:grid;
grid-template-columns:2fr 1.5fr 1fr 1fr 1fr auto;
gap:15px;
}

.form-grid input,
.form-grid select{
padding:15px;
border:none;
border-radius:14px;
background:rgba(255,255,255,0.06);
color:white;
outline:none;
font-size:15px;
}

.form-grid button{
border:none;
border-radius:14px;
padding:15px 20px;
background:linear-gradient(90deg,#9333ea,#2563eb);
color:white;
font-weight:bold;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
overflow:hidden;
border-radius:20px;
}

thead{
background:linear-gradient(90deg,#a855f7,#2563eb);
}

th{
padding:18px;
font-size:17px;
}

td{
padding:18px;
background:rgba(15,23,42,0.75);
text-align:center;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.progress-bar{
width:100%;
height:10px;
background:#1e293b;
border-radius:10px;
overflow:hidden;
}

.progress{
height:100%;
background:linear-gradient(90deg,#a855f7,#38bdf8);
}

.doneBtn{
background:#22c55e;
}

.editBtn{
background:#f59e0b;
}

.deleteBtn{
background:#ef4444;
}

.action-btn{
border:none;
padding:10px 12px;
margin:2px;
border-radius:8px;
color:white;
cursor:pointer;
}

.completed{
text-decoration:line-through;
opacity:0.6;
}

@media(max-width:1000px){

.overlay{
flex-direction:column;
}

.sidebar{
width:100%;
}

.form-grid{
grid-template-columns:1fr;
}

table,
thead,
tbody,
tr,
th,
td{
display:block;
width:100%;
}

thead{
display:none;
}

tr{
margin-bottom:15px;
}

td{
text-align:left;
}

}

</style>
</head>

<body>

<div class="overlay">

<div class="sidebar">

<div>

<div class="logo">TaskFlow</div>

<div class="menu">

<a href="#" onclick="filterTasks('all')">🏠 Dashboard</a>

<a href="#" onclick="filterTasks('all')">📋 All Tasks</a>

<a href="#" onclick="filterTasks('completed')">✅ Completed</a>

<a href="#" onclick="filterTasks('pending')">⏰ Pending</a>

</div>

</div>

<div class="dark-toggle">
🌙 Dark Mode
</div>

</div>

<div class="main">

<div class="heading">
Modern Task Dashboard
</div>

<div class="cards">

<div class="card">
<h2>Total Tasks</h2>
<p id="totalTasks">0</p>
<div class="line purple"></div>
</div>

<div class="card">
<h2>Completed</h2>
<p id="completedTasks">0</p>
<div class="line green"></div>
</div>

<div class="card">
<h2>Pending</h2>
<p id="pendingTasks">0</p>
<div class="line orange"></div>
</div>

<div class="card">
<h2>Today</h2>
<p id="todayTasks">0</p>
<div class="line blue"></div>
</div>

</div>

<div class="form-box">

<div class="form-grid">

<input type="text" id="taskInput" placeholder="Enter your task">

<input type="date" id="taskDate">

<input type="time" id="startTime">

<input type="time" id="endTime">

<select id="priority">

<option value="High">High</option>
<option value="Medium">Medium</option>
<option value="Low">Low</option>

</select>

<button id="addBtn">+ Add Task</button>

</div>

</div>

<table>

<thead>

<tr>
<th>Task</th>
<th>Date</th>
<th>Start Time</th>
<th>End Time</th>
<th>Priority</th>
<th>Status</th>
<th>Progress</th>
<th>Actions</th>
</tr>

</thead>

<tbody id="taskTable"></tbody>

</table>

</div>

</div>

<script>

const taskInput = document.getElementById("taskInput");
const taskDate = document.getElementById("taskDate");
const startTime = document.getElementById("startTime");
const endTime = document.getElementById("endTime");
const priority = document.getElementById("priority");
const addBtn = document.getElementById("addBtn");
const taskTable = document.getElementById("taskTable");

const totalTasks = document.getElementById("totalTasks");
const completedTasks = document.getElementById("completedTasks");
const pendingTasks = document.getElementById("pendingTasks");
const todayTasks = document.getElementById("todayTasks");

let tasks = JSON.parse(localStorage.getItem("modernTasks")) || [];

function saveTasks(){
localStorage.setItem("modernTasks",JSON.stringify(tasks));
}

function updateCards(){

totalTasks.innerText = tasks.length;

const completed = tasks.filter(task => task.completed).length;

completedTasks.innerText = completed;

pendingTasks.innerText = tasks.length - completed;

const today = new Date().toISOString().split("T")[0];

const todayCount = tasks.filter(task => task.date === today).length;

todayTasks.innerText = todayCount;

}

function displayTasks(filter = "all"){

taskTable.innerHTML = "";

let filteredTasks = tasks;

if(filter === "completed"){
filteredTasks = tasks.filter(task => task.completed);
}

else if(filter === "pending"){
filteredTasks = tasks.filter(task => !task.completed);
}

filteredTasks.forEach((task,index)=>{

const originalIndex = tasks.indexOf(task);

const row = document.createElement("tr");

row.innerHTML = `

<td class="${task.completed ? 'completed' : ''}">
${task.name}
</td>

<td>${task.date}</td>

<td>${task.start}</td>

<td>${task.end}</td>

<td>${task.priority}</td>

<td>
${task.completed ? "Completed" : "Pending"}
</td>

<td>

<div class="progress-bar">
<div class="progress" style="width:${task.completed ? '100%' : '45%'}"></div>
</div>

</td>

<td>

<button class="action-btn doneBtn" onclick="toggleTask(${originalIndex})">
Done
</button>

<button class="action-btn editBtn" onclick="editTask(${originalIndex})">
Edit
</button>

<button class="action-btn deleteBtn" onclick="deleteTask(${originalIndex})">
Delete
</button>

</td>

`;

taskTable.appendChild(row);

});

updateCards();

}

function filterTasks(type){
displayTasks(type);
}

addBtn.addEventListener("click",()=>{

if(taskInput.value.trim() === ""){
alert("Please enter task");
return;
}

if(taskDate.value === ""){
alert("Please select date");
return;
}

const task = {

name:taskInput.value,
date:taskDate.value,
start:startTime.value,
end:endTime.value,
priority:priority.value,
completed:false

};

tasks.push(task);

saveTasks();
displayTasks();

taskInput.value = "";
taskDate.value = "";
startTime.value = "";
endTime.value = "";

});

function toggleTask(index){

tasks[index].completed = !tasks[index].completed;

saveTasks();
displayTasks();

}

function editTask(index){

const updated = prompt("Edit Task",tasks[index].name);

if(updated !== null && updated.trim() !== ""){

tasks[index].name = updated;

saveTasks();
displayTasks();

}

}

function deleteTask(index){

tasks.splice(index,1);

saveTasks();
displayTasks();

}

displayTasks();

</script>

</body>
</html>
